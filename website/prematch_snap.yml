          - paragraph [ref=e84]:
            - text: 先去安装助手页按教程把浏览器插件装好，找一场复播测试一下——看到
            - strong [ref=e85]: 「时差观赛模式已开启」
            - text: 就说明武装到位了。这一步只折腾一次，后面只管享受。
        - article [ref=e86]:
          - generic: "2"
          - heading "手机「免打扰模式」" [level=3] [ref=e87]
          - paragraph [ref=e88]:
            - text: 确认好比赛时间，当晚把手机切到
            - strong [ref=e89]: 免打扰模式
            - text: 。新闻APP、社交平台、短视频——能弹出比分的，统统关掉通知。宁可杀错一千，不可放过一个，谁都别想影响老子看世界杯。
        - article [ref=e90]:
          - generic: "3"
          - heading "浏览器开好SCGS.TV页面" [level=3] [ref=e91]
          - paragraph [ref=e92]:
            - text: 在电脑上打开浏览器，进入
            - strong [ref=e93]: scgs.tv 的赛程页面
            - text: 并停在那里。建议按
            - strong [ref=e94]: F11 进入全屏模式
            - text: ，同时检查电脑弹窗通知，然后合上盖子或进入睡眠模式——第二天唤醒屏幕就不会被任何推送偷袭。
        - article [ref=e95]:
          - generic: "4"
          - heading "凌晨仪式 + 唤醒看球" [level=3] [ref=e96]
          - paragraph [ref=e97]:
            - strong [ref=e98]: 定好闹钟
            - text: ，上班前两小时起床。忍住别看手机——任何推送都可能是叛徒。洗漱提神，备好零食花生和冰镇饮料，坐到电脑前唤醒屏幕，浏览器还停在昨晚的 scgs.tv 页面，
            - strong [ref=e99]: 点开播放
            - text: ，享受无剧透的纯粹足球。
