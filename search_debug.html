//轮播图们函数
	;(function (window){
			function Lunbo(obj){
				var self=this;
				this.oUl=$(obj.oUl);
				this.oLi=$(obj.oLi);
				this.btnl=$(obj.btnl);
				this.btnr=$(obj.btnr);
				this.ml=obj.ml||0;
				this.group=obj.group||1;
				this.dot=$(obj.dot);															
			//计数	
				this.num=0;
			//li个数	
				var liLen=this.oLi.length;
				
			//计算ul的长度（等于整屏宽度的整数倍）
				if(liLen%this.group>0){
					var yu=this.group-liLen%this.group;
					liLen=liLen+yu;
				}
				//一共几屏
				this.s1=liLen/this.group;

				//li加上margin的宽度
				var liW=this.oLi.outerWidth()+this.ml;				
				this.oUl.width(liLen*liW);				
			//一屏的宽度
				this.gw=liW*this.group;
			//点击向右
				this.btnr.click(function(){
					self.moveR();
				});
			//点击向左
				this.btnl.click(function(){
					self.moveL();
				});
			//点
				self.dot.click(function(){
					var index=$(this).index();
					self.num=index;
					self.dot.eq(self.num).addClass("cur").siblings().removeClass("cur");
					self.oUl.animate({"margin-left":-self.num*self.gw+"px"},500);
				})
				
		}
		Lunbo.prototype={
			moveR:function(){
				var self=this;				
				self.num++;
				if(self.num>=self.s1){
					self.num=self.s1-1;
				}
				self.oUl.animate({"margin-left":-self.num*self.gw+"px"},500);
				if(self.dot){
					self.dot.eq(self.num).addClass("cur").siblings().removeClass("cur");
				}
			},
			moveL:function(){
				var self=this;
				self.num--;
				if(self.num<=0){
					self.num=0;
				}
				self.oUl.animate({"margin-left":-self.num*self.gw+"px"},500);
				if(self.dot){
					self.dot.eq(self.num).addClass("cur").siblings().removeClass("cur");
				}
			}
		}		
		window.Lunbo=Lunbo;		
	})(window);
